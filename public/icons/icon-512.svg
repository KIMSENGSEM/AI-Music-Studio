<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="studioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="#07080c" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#discGrad)" stroke="url(#studioGrad)" stroke-width="6" />

  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#475569" stroke-width="2.5" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#64748b" stroke-width="2" stroke-opacity="0.35" />

  <!-- Center Badge -->
  <circle cx="256" cy="256" r="64" fill="url(#studioGrad)" />
  <circle cx="256" cy="256" r="22" fill="#07080c" />

  <!-- Musical Sound Waves -->
  <path d="M 120 256 Q 160 170 200 256 T 280 256 T 360 256" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <path d="M 152 256 Q 180 320 220 256 T 300 256 T 370 256" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.85" />
</svg>
